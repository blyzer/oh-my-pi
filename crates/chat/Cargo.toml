[package]
name = "omp-chat"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Projection-only interactive chat actor for the OMP session DOM"

[lints]
workspace = true

[features]
# Typed forge/ci cards need the contract modules on omp-tools. Defaults are on
# for root `cargo test -p omp-chat`. Workspace `omp-chat` sets
# `default-features = false` so `omp-app --features local` under selected
# unification can leave forge/ci out; app `cap-forge`/`cap-ci` turn them back on.
default = ["cap-forge", "cap-ci"]
cap-forge = ["omp-tools/cap-forge"]
cap-ci = ["omp-tools/cap-ci"]

[dependencies]
bytes.workspace = true
flume.workspace = true
image.workspace = true
jiff.workspace = true
notify.workspace = true
omp-agent.workspace = true
omp-con.workspace = true
omp-core = { workspace = true, features = ["open"] }
omp-dom.workspace = true
omp-ai.workspace = true
omp-journal.workspace = true
omp-proto.workspace = true
omp-session.workspace = true
omp-tui.workspace = true
omp-tool.workspace = true
omp-tools.workspace = true
omp-audio.workspace = true
omp-vcs.workspace = true
omp-walker.workspace = true
parking_lot.workspace = true
regex.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
smallvec.workspace = true
strum.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
xutf.workspace = true

[target.'cfg(unix)'.dependencies]
nix.workspace = true

[dev-dependencies]
insta.workspace = true
# Hermetic `git` fixtures: tests never read the developer's git configuration.
omp-vcs = { workspace = true, features = ["test-support"] }
# The vocalizer tests play on the virtual speaker, never the host's device.
omp-audio = { workspace = true, features = ["virtual-output"] }
