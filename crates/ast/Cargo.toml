[package]
name = "omp-ast"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Tree-sitter-backed source analysis, structural search, and AST-aware editing for omp"

[lints]
workspace = true

[features]
default = ["grammars-all"]
grammars-hot = [
	"dep:tree-sitter-bash",
	"dep:tree-sitter-c",
	"dep:tree-sitter-cpp",
	"dep:tree-sitter-css",
	"dep:tree-sitter-diff",
	"dep:tree-sitter-go",
	"dep:tree-sitter-html",
	"dep:tree-sitter-java",
	"dep:tree-sitter-javascript",
	"dep:tree-sitter-json",
	"dep:tree-sitter-md",
	"dep:tree-sitter-python",
	"dep:tree-sitter-regex",
	"dep:tree-sitter-rust",
	"dep:tree-sitter-toml-ng",
	"dep:tree-sitter-typescript",
	"dep:tree-sitter-yaml",
]
grammars-all = [
	"grammars-hot",
	"dep:tree-sitter-astro",
	"dep:tree-sitter-clojure",
	"dep:tree-sitter-cmake",
	"dep:tree-sitter-c-sharp",
	"dep:tree-sitter-dart",
	"dep:tree-sitter-dockerfile",
	"dep:tree-sitter-elixir",
	"dep:tree-sitter-elisp",
	"dep:tree-sitter-erlang",
	"dep:tree-sitter-fortran",
	"dep:tree-sitter-graphql",
	"dep:tree-sitter-haskell",
	"dep:tree-sitter-hcl",
	"dep:tree-sitter-ini",
	"dep:tree-sitter-just",
	"dep:tree-sitter-julia",
	"dep:tree-sitter-kotlin",
	"dep:tree-sitter-lua",
	"dep:tree-sitter-make",
	"dep:tree-sitter-nix",
	"dep:tree-sitter-objc",
	"dep:tree-sitter-ocaml",
	"dep:tree-sitter-odin",
	"dep:tree-sitter-php",
	"dep:tree-sitter-powershell",
	"dep:tree-sitter-proto",
	"dep:tree-sitter-r",
	"dep:tree-sitter-ruby",
	"dep:tree-sitter-scala",
	"dep:tree-sitter-solidity",
	"dep:tree-sitter-sql",
	"dep:tree-sitter-starlark",
	"dep:tree-sitter-svelte",
	"dep:tree-sitter-swift",
	"dep:tree-sitter-tlaplus",
	"dep:tree-sitter-verilog",
	"dep:tree-sitter-vue",
	"dep:tree-sitter-xml",
	"dep:tree-sitter-zig",
]
wasm = ["tree-sitter/wasm"]

[dependencies]
thiserror.workspace = true
ast-grep-core.workspace = true
omp-walker.workspace = true
ignore.workspace = true
omp-core.workspace = true
serde.workspace = true
smallvec.workspace = true
strum.workspace = true
tree-sitter.workspace = true
tree-sitter-astro = { workspace = true, optional = true }
tree-sitter-bash = { workspace = true, optional = true }
tree-sitter-c = { workspace = true, optional = true }
