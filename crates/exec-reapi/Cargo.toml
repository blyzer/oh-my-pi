[package]
name = "omp-exec-reapi"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Remote Execution API v2 client backend for omp-exec: CAS, action cache, execute and cancel over gRPC, with vendor behaviour as profile data"
readme = "README.md"

[features]
default = []
# BuildBuddy's proprietary invocation-cancel RPC (`BuildBuddyService.CancelExecutions`):
# the one vendor-specific wire behaviour, gated so the generic client carries none.
buildbuddy-cancel = []

[dependencies]
bytes.workspace = true
omp-core.workspace = true
omp-exec.workspace = true
prost.workspace = true
prost-types.workspace = true
thiserror.workspace = true
tonic.workspace = true
tonic-prost.workspace = true

[build-dependencies]
protox.workspace = true
prost-types.workspace = true
tonic-prost-build.workspace = true

[lints]
workspace = true
