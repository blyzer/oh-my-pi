[package]
name = "omp-collab"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Bounded encrypted relay and replication substrate for OMP collaboration"
readme = "README.md"
[lib]
path = "lib.rs"

[features]
# In-process content-blind relay server (`test_relay`) for joined-system proofs.
# The hosted relay is not self-hostable, so tests dial this instead.
test-relay = ["dep:parking_lot"]

[lints]
workspace = true

[dependencies]
bytes.workspace = true
flume.workspace = true
futures.workspace = true
http.workspace = true
omp-core.workspace = true
omp-proto.workspace = true
parking_lot = { workspace = true, optional = true }
prost.workspace = true
rand.workspace = true
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
strum.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
parking_lot.workspace = true
tempfile.workspace = true
