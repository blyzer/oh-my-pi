id = "omp.welcome-chrome"
name = "Welcome chrome"
version = "0.1.0"
omp_api = 1
description = "Declarative welcome header, recent-session picker, tips, and activity title effects."
entry = "omp_welcome_chrome.welcome_chrome"
capabilities = ["sessions.read", "ui.dialogs", "ui.slots", "ui.title"]

[[hooks]]
event = "session_start"
phase = "observe"
order = 40
failure = "fail-open"

[[hooks]]
event = "agent_start"
phase = "observe"
order = 40
failure = "fail-open"

[[hooks]]
event = "agent_end"
phase = "observe"
order = 40
failure = "fail-open"

[[hooks]]
event = "session_shutdown"
phase = "observe"
order = 40
failure = "fail-open"

[requires]
python = ">=3.14"

[settings]
tips = [
  "Use /help to discover commands without leaving the composer.",
  "Resume a recent session to keep its durable journal and context.",
  "Named icons and theme tokens adapt to the active terminal.",
]
