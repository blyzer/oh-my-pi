id = "omp.remote-approve"
name = "Remote approve"
version = "0.1.0"
omp_api = 1
description = "Route durable approval tickets to a remote phone or watch service."
entry = "omp_remote_approve"
capabilities = ["env.net", "env.net.fetch", "schedules:project"]

[settings.webhook]
type = "string"
default = "https://approvals.example.invalid/omp"

[settings.poll_interval]
type = "string"
default = "30s"

[settings.unreachable]
type = "string"
default = "ask"

[settings.allow_fail_open]
type = "boolean"
default = false

# The approver is registered by `@omp.approver` in `device` and has no row of
# its own. The two hooks below are the ones `device` registers: the first
# upserts the poll schedule and reconciles pending tickets when the extension
# activates, the second polls on each turn start.

[[declarations]]
id = "activate_remote_approval"
kind = "hook"
module = "omp_remote_approve"
key = "extension_activate/observe"
trigger = "lazy"
api = 1
failure = "fail-open"

[[declarations]]
id = "poll_remote_approval"
kind = "hook"
module = "omp_remote_approve"
key = "turn_start/observe"
trigger = "lazy"
api = 1
failure = "fail-open"
