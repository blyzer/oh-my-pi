id = "omp.remote-approve"
name = "Remote approve"
version = "0.1.0"
omp_api = 1
description = "Route durable approval tickets to a remote phone or watch service."
entry = "omp_remote_approve"
capabilities = ["env.net.fetch", "schedules:project"]

[settings.webhook]
type = "string"
default = "https://approvals.example.invalid/omp"

[settings.poll_interval]
type = "string"
default = "30s"

[settings.unreachable]
type = "string"
default = "ask"

[settings.allow_fail_open]
type = "boolean"
default = false
