id = "omp.remote-approve"
name = "Remote approve"
version = "0.1.0"
omp_api = 1
description = "Route durable approval tickets to a remote phone or watch service."
entry = "omp_remote_approve"
capabilities = ["env.net.fetch", "schedules:project"]

[requires]
python = ">=3.14"

[settings]
webhook = "https://approvals.example.invalid/omp"
poll_interval = "30s"
unreachable = "ask"
allow_fail_open = false
