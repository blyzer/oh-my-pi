# Error-formatting ratchet baseline (ADR 0035). Per-crate counts of the `error-str-payload`
# and `error-format` lintx rules; see tools/lintx/README.md for the exact patterns.
# A crate may never exceed its count; absent crates have a baseline of zero. Lower this file
# with `just lintx-ratchet-update` after migrating sites; it refuses to raise any count.

[error-format]
shell-builtins = 184
tools = 10
walker = 2

[error-str-payload]
agent = 1
core = 1
edit = 2
envd = 54
observability = 1
rpc = 1
shell = 4
shell-builtins = 13
tool = 1
tools = 27
vcs = 1
