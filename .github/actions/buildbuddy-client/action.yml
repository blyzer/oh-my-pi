name: Install BuildBuddy client
description: Restore or download and cache the pinned bb binary, then add it to PATH.

inputs:
  version:
    description: BuildBuddy client version to install
    default: '5.0.492'
  sha256:
    description: Expected SHA-256 of the downloaded binary
    default: 'e9e996a1a01555e45433acf9432f9d40d5bda437812a830d6701fe9b09853df9'

runs:
  using: composite
  steps:
    - name: Restore cached bb binary
      id: cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ runner.temp }}/bin/bb
        key: bb-${{ inputs.version }}

    - name: Download and verify bb binary
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        BB_VERSION: ${{ inputs.version }}
        BB_SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/bin"
        curl --fail --location --silent --show-error \
          "https://github.com/buildbuddy-io/bazel/releases/download/${BB_VERSION}/bazel-${BB_VERSION}-linux-x86_64" \
          --output "$RUNNER_TEMP/bin/bb"
        printf '%s  %s\n' "$BB_SHA256" "$RUNNER_TEMP/bin/bb" | sha256sum --check --status
        chmod 0755 "$RUNNER_TEMP/bin/bb"

    - name: Ensure bb is executable after cache restore
      if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: chmod 0755 "$RUNNER_TEMP/bin/bb"

    - name: Add bb to PATH
      shell: bash
      run: echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
