name: Package macOS

# Builds the release omp for aarch64-apple-darwin, packages it with
# scripts/package-macos.sh and installs the result into a scratch prefix with
# scripts/install-smoke-macos.sh. The same two steps run locally as
# `just package-macos` and `just install-smoke-macos`; this workflow only
# runs them on the macOS runner and keeps the artifacts. It publishes
# nothing.
#
# Manual only: a cold release build (thin LTO, one codegen unit, the LTO
# CPython bundle) is far too slow for every push.
on:
  workflow_dispatch:
  # Only to prove changes to this workflow and the scripts it runs.
  pull_request:
    branches: [omp2]
    paths:
      - ".github/workflows/package-macos.yml"
      - "scripts/package-macos.sh"
      - "scripts/install-smoke-macos.sh"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  package:
    name: Package and install-smoke omp (macOS arm64)
    runs-on: ${{ fromJSON(vars.MACOS_RUNNER || '"macos-15"') }}
    # The release LTO build can exceed three hours on a cold/self-hosted
    # Apple-silicon runner; cancellation at the old limit produced no compiler
    # diagnostic and left the package job inconclusive.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Select pinned Rust toolchain
        run: |
          test "$(uname -m)" = arm64
          rustup show active-toolchain

      # Same provisioning as the rust job in ci.yml. The release build links
      # the LTO CPython bundle, which needs ld64.lld.
      - uses: ./.github/actions/macos-native-tools

      - uses: ./.github/actions/macos-build-state
        with:
          min-free-gb: ${{ vars.CI_MIN_FREE_GB || '60' }}

      # `just build-release`, spelled out so the runner needs no `just`.
      # sccache caches pre-LTO crate compilations via BuildBuddy when the org
      # key is available. Fork PRs compile uncached. The LTO link always runs
      # locally (LTO bitcode is architecture-specific).
      # Limit concurrent Cargo units: the LTO CPython link is memory-heavy and
      # unrestricted parallelism can swap until the package timeout.
      - name: Install sccache
        if: ${{ secrets.BUILDBUDDY_ORG_API_KEY != '' }}
        env:
          SCCACHE_VERSION: 0.10.0
          SCCACHE_SHA256: 5aba39252e2efa26bd76144f87ac59787d60fe567ab785e27e2a8c8190892eac
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            "https://github.com/mozilla/sccache/releases/download/v${SCCACHE_VERSION}/sccache-v${SCCACHE_VERSION}-aarch64-apple-darwin.tar.gz" \
            --output sccache.tar.gz
          printf '%s  %s\n' "$SCCACHE_SHA256" sccache.tar.gz | shasum -a 256 --check --status
          tar -xz --strip-components=1 -C /usr/local/bin sccache-v${SCCACHE_VERSION}-aarch64-apple-darwin/sccache < sccache.tar.gz
          rm sccache.tar.gz
          sccache --version

      - name: Build release omp
        timeout-minutes: 220
        env:
          CARGO_BUILD_JOBS: "4"
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}
        run: |
          echo '::group::cargo build (release, LTO, embedded Python)'
          if [ -n "${BUILDBUDDY_API_KEY-}" ] && command -v sccache >/dev/null 2>&1; then
            echo "::notice::sccache + BuildBuddy GCS cache active for crate compilations"
            export RUSTC_WRAPPER="sccache"
            sccache --start-server 2>/dev/null || true
          fi
          PYO3_CONFIG_FILE="$GITHUB_WORKSPACE/vendor/python-release/pyo3-config.txt" \
            cargo build -p omp-app --bin omp --release --locked
          if [ -n "${RUSTC_WRAPPER-}" ]; then sccache --show-stats || true; fi
          echo '::endgroup::'

      - name: Package
        timeout-minutes: 5
        run: |
          target=$(cargo metadata --no-deps --format-version 1 --locked |
            python3 -c 'import json, sys; print(json.load(sys.stdin)["target_directory"])')
          scripts/package-macos.sh "$target/release/omp"

      - name: Install smoke
        timeout-minutes: 5
        continue-on-error: true
        run: scripts/install-smoke-macos.sh dist

      - name: Upload partial artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omp-macos-arm64-partial-${{ github.sha }}
          path: |
            dist/
            target/release/omp
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload packages
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omp-macos-arm64-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.pkg
            dist/*.sha256
          if-no-files-found: warn
          retention-days: 14
