name: Runner git diagnostics

# Manual only. Shows where the self-hosted macOS runner's git and ssh settings
# for github.com come from, to explain why a checkout once went over SSH.
# The repository is public, so the log is too. It keeps only what the
# diagnosis needs: whether github.com traffic is rewritten, by which rule, and
# from which well-known config file. Credentials, hosts other than GitHub's,
# includeIf conditions, included files, variable values and resolver details
# are redacted, and repeated rules are counted instead of listed.
# No checkout step, so HOME is the runner's real one.
# Start a run by pushing to the diag/runner-git branch; commits marked
# [skip ci] change the workflow without running it.
on:
  push:
    branches: [diag/runner-git]

permissions:
  contents: read

jobs:
  diagnose:
    name: Git and SSH origins on the runner
    runs-on: ${{ fromJSON(vars.MACOS_RUNNER || '"macos-15"') }}
    timeout-minutes: 10
    steps:
      - name: Report git and ssh configuration origins
        shell: bash --noprofile --norc {0}
        run: |
          set -u
          # Credentials in URLs, and every host other than GitHub's, are redacted: the
          # diagnosis only needs to know whether traffic still goes to github.com.
          redact() {
            perl -pe '
              s{(://)[^/\@\s]+\@}{$1<redacted>\@}g;
              s{(://(?:<redacted>\@)?+)(?!(?:ssh\.)?github\.com(?:[/:\s]|$))[^/:\s<>\@]+}{$1<host>}g;
              s{(\w\@)(?!(?:ssh\.)?github\.com:)[A-Za-z0-9.-]+:}{$1<host>:}g;
            '
          }
          # includeIf conditions and include paths name local directories and files,
          # which can identify clients or employers: keep only the rule's shape.
          redact_rules() {
            redact | sed -E \
              -e 's#(includeif\.[a-z/]+:)[^[:space:]]*\.path[[:space:]].*#\1<redacted>.path <redacted>#' \
              -e 's#(include\.path)[[:space:]].*#\1 <redacted>#'
          }
          # Well-known config locations print as they are; anything else, such as a
          # file pulled in by an include, only as <redacted>.
          known_path() {
            case "$1" in
              "$HOME/.gitconfig" | "$HOME/.config/git/config" | .git/config | \
                /etc/gitconfig | /opt/homebrew/etc/gitconfig | /usr/local/etc/gitconfig | \
                "$HOME/.ssh/config" | /etc/ssh/ssh_config) echo "$1" ;;
              *) echo "<redacted>" ;;
            esac
          }
          section() { echo; echo "== $1 =="; }

          section "runner"
          echo "runner=${RUNNER_NAME:-?} os=${RUNNER_OS:-?} user=$(id -un) HOME=$HOME"
          git --version

          section "checkout URL after git's rewrite rules"
          git ls-remote --get-url "https://github.com/${GITHUB_REPOSITORY:-blyzer/oh-my-pi}" | redact

          section "git rules that can redirect github.com (origin + scope)"
          rules=$(git config --show-origin --show-scope --get-regexp \
            '^(url\..*\.(insteadof|pushinsteadof)|core\.sshcommand|includeif\..*|include\.path)$' || true)
          if [ -n "$rules" ]; then
            echo "$rules" | redact_rules |
              while IFS=$'\t' read -r scope origin rule; do
                case "$origin" in
                  file:*) origin="file:$(known_path "${origin#file:}")" ;;
                esac
                printf '%s\t%s\t%s\n' "$scope" "$origin" "$rule"
              done | sort | uniq -c
          else
            echo "(none)"
          fi

          section "git config files in play"
          git config --show-origin --show-scope --list | awk -F'\t' '{print $1"\t"$2}' | sort -u |
            while IFS=$'\t' read -r scope origin; do
              case "$origin" in
                file:*) origin="file:$(known_path "${origin#file:}")" ;;
              esac
              printf '%s\t%s\n' "$scope" "$origin"
            done | sort | uniq -c

          section "GIT_/SSH_ variables in the job environment (names only)"
          env | grep -E '^(GIT_|SSH_)' | sed -E 's/=.*//' | sort || true
          [ -z "$(env | grep -E '^(GIT_|SSH_)')" ] && echo "(none)"

          section "runner .env (names only)"
          runner_root="${RUNNER_WORKSPACE:-}"; runner_root="${runner_root%/_work/*}"
          if [ -n "$runner_root" ] && [ -f "$runner_root/.env" ]; then
            sed -E 's/=.*//' "$runner_root/.env"
          else
            echo "(no .env at ${runner_root:-?})"
          fi

          section "effective ssh settings for github.com"
          if command -v ssh >/dev/null; then
            ssh -G github.com 2>&1 | grep -Ei '^(hostname|user|port|proxycommand|proxyjump) ' |
              perl -pe 's{^(hostname) (?!(?:ssh\.)?github\.com$).*}{$1 <host>}i; s{^(proxycommand|proxyjump) .*}{$1 <set>}i'
            echo "ssh config files mentioning github:"
            found=$(grep -lis 'github' "$HOME/.ssh/config" /etc/ssh/ssh_config /etc/ssh/ssh_config.d/* 2>/dev/null || true)
            if [ -n "$found" ]; then
              echo "$found" | while read -r path; do known_path "$path"; done | sort | uniq -c
            else
              echo "(none)"
            fi
          fi

          section "name resolution"
          if command -v dscacheutil >/dev/null; then
            dscacheutil -q host -a name github.com | grep -E '^(name|ip_address)'
            echo "resolvers:"
            scutil --dns | grep -E '^resolver #|^  (domain|nameserver\[[0-9]+\]|search domain\[[0-9]+\])' \
              | sed -E 's/(: ).*/\1<redacted>/' | uniq -c | head -40
          else
            getent hosts github.com || true
          fi

          section "ssh reachability (no prompts, 10 s)"
          if command -v ssh >/dev/null; then
            ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes -T git@github.com 2>&1 | head -2 | sed -E 's/^Hi [^!]+!/Hi <user>!/'
            echo "exit=${PIPESTATUS[0]}"
          fi
