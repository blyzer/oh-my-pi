name: CI

on:
  # KEEP IN SYNC with .github/ci-paths.txt (`just check-ci-paths`).
  push:
    branches: [main, omp2]
    paths:
      - ".cargo/**"
      - ".config/**"
      - ".github/actions/**"
      - ".github/ci-paths.txt"
      - ".github/workflows/ci.yml"
      - "about.toml"
      - "deny.toml"
      - "justfile"
      - "LICENSE*"
      - "THIRD-PARTY-NOTICES.txt"
      - "crates/**"
      - "examples/**"
      - "fixtures/**"
      - "docs/py/**"
      - "scripts/**"
      - "tools/lintx/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "clippy.toml"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
  # No `paths` filter here on purpose: a workflow that a path filter keeps out
  # never reports its jobs, and the required checks would stay pending. The
  # `changes` job below reads .github/ci-paths.txt instead, and every other
  # job is skipped, which a required check counts as passing.
  pull_request:
    branches: [main, omp2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  # Decides whether a pull request touches anything CI proves. Every required
  # check is a job of this workflow; when no CI path changed, they are all
  # skipped, and a skipped required check passes. The decision fails closed:
  # if this job errors, `ci` is empty and the jobs run.
  changes:
    name: Detect CI-relevant changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ci: ${{ steps.paths.outputs.ci }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Match the changed files against .github/ci-paths.txt
        id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -z "$PULL_REQUEST" ]; then
            echo "Not a pull request; CI is needed"
            echo "ci=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/$REPO/pulls/$PULL_REQUEST/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')
          while IFS= read -r file; do
            while IFS= read -r pattern; do
              case "$pattern" in ''|'#'*) continue ;; esac
              # A `**` glob is a plain prefix match here; case patterns let `*` cross `/`.
              # shellcheck disable=SC2254
              case "$file" in ${pattern//\*\*/\*})
                echo "$file matches $pattern; CI is needed"
                echo "ci=true" >> "$GITHUB_OUTPUT"
                exit 0
              ;; esac
            done < .github/ci-paths.txt
          done <<< "$files"
          echo "No CI-relevant path changed; the CI jobs are skipped"
          echo "ci=false" >> "$GITHUB_OUTPUT"

  format:
    name: Rust format
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.ci != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check the CI gate
        run: python3 scripts/check-ci-paths.py

  # ADR 0035: lintx counts bare-string error variants and formatted error
  # values per crate and fails a crate whose count rose above
  # tools/lintx/baselines/error-formatting.toml. lintx is its own Cargo
  # workspace (not a member of the root one), so it is built and tested here.
  lintx_ratchet:
    name: Error-formatting ratchet (lintx)
    needs: format
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Cache lintx build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            tools/lintx/target
          key: lintx-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/lintx/Cargo.lock', 'tools/lintx/Cargo.toml', 'rust-toolchain.toml') }}
      - name: Test lintx
        run: cargo test --locked --manifest-path tools/lintx/Cargo.toml
      - name: Check the error-formatting ratchet
        run: cargo run --quiet --release --locked --manifest-path tools/lintx/Cargo.toml -- --ratchet tools/lintx/baselines/error-formatting.toml crates

  runtime_spec:
    name: Runtime symbol and dependency contracts
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.ci != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Generate and validate runtime specification
        run: cargo -Zscript scripts/check-spec.rs -- target/runtime-symbol-spec.json

  licenses:
    name: License policy and release notices
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.ci != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain
      # Building these three from source took about five minutes of a
      # ten-second check. The versions are pinned, so the binaries are too.
      - name: Cache pinned compliance tools
        id: compliance-tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin/just
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-about
          key: compliance-tools-${{ runner.os }}-${{ runner.arch }}-just-1.58.0-cargo-deny-0.20.2-cargo-about-0.8.2
      - name: Install pinned compliance tools
        if: steps.compliance-tools.outputs.cache-hit != 'true'
        run: |
          cargo install --locked --version 1.58.0 just
          cargo install --locked --version 0.20.2 cargo-deny
          cargo install --locked --version 0.8.2 cargo-about
      - name: Check license policy and release notices
        run: just license-check

  # A push to omp2 or main is almost always a pull request's merge commit.
  # When that pull request's head already contained the base, the merge
  # commit has exactly the tree the pull request's own `rust` run just
  # proved, and running it again only occupies the macOS runner for another
  # 8-15 minutes per merge. This job finds the merged pull request, compares
  # the pushed tree with its head's, and reads the head's latest `rust` check
  # run. `rust` skips only on an identical tree whose run concluded success;
  # anything else (a direct push, a head behind its base, an API error, a
  # failure of this job) leaves `verified` unset and `rust` runs as before.
  push_verified:
    name: Pushed tree already verified
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      verified: ${{ steps.tree.outputs.verified }}
    steps:
      - name: Match the pushed tree to a green pull request run
        id: tree
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          CHECK: Rust workspace and acceptance proofs
        run: |
          set -euo pipefail
          head=$(gh api "repos/$REPO/commits/$SHA/pulls" \
            --jq "[.[] | select(.merge_commit_sha == \"$SHA\")][0].head.sha // empty")
          if [ -z "$head" ]; then
            echo "No pull request was merged as $SHA; running the macOS job"
            exit 0
          fi
          pushed=$(gh api "repos/$REPO/commits/$SHA" --jq .commit.tree.sha)
          tested=$(gh api "repos/$REPO/commits/$head" --jq .commit.tree.sha)
          if [ "$pushed" != "$tested" ]; then
            echo "Pushed tree $pushed differs from head $head's $tested; running the macOS job"
            exit 0
          fi
          encoded=$(jq -rn --arg name "$CHECK" '$name | @uri')
          conclusion=$(gh api "repos/$REPO/commits/$head/check-runs?check_name=$encoded&filter=latest" \
            --jq '[.check_runs[] | select(.app.slug == "github-actions")][0].conclusion // empty')
          if [ "$conclusion" != "success" ]; then
            echo "Head $head's '$CHECK' concluded '${conclusion:-none}'; running the macOS job"
            exit 0
          fi
          echo "Tree $pushed already passed '$CHECK' on $head; skipping the macOS job"
          echo "verified=true" >> "$GITHUB_OUTPUT"

  rust:
    name: Rust workspace and acceptance proofs
    # Deliberately NOT gated on runtime_spec. That check is cheap and reports
    # in two minutes; this one is the expensive proof and the only place the
    # suite and P1-P8 ever run on macOS (P9-P11 and tool_sources run in
    # p9_p10_linux). Chaining them meant a red spec gate skipped
    # the suite entirely, so the branch could not learn whether it passed. They are independent questions and now answer in parallel.
    # This does not weaken the gate: runtime_spec still reports its own
    # conclusion and can still be a required check in branch protection.
    # The license policy is the same kind of independent question and is not
    # a precondition either; waiting on it held this job back five minutes.
    # On a push, push_verified may show the tree already passed this job in
    # its pull request; a skipped or failed push_verified never skips it.
    needs: [format, push_verified]
    if: ${{ !cancelled() && needs.format.result == 'success' && needs.push_verified.outputs.verified != 'true' }}
    # GitHub's macos-15 unless the repository variable MACOS_RUNNER names
    # somewhere else. Set it to a JSON label array to send this job to a
    # self-hosted Apple silicon machine, which is the only way to give it more
    # than a hosted runner's disk — every test binary statically links the
    # ~650 MB CPython, so a full link is large:
    #     gh variable set MACOS_RUNNER --body '["self-hosted","macOS","ARM64"]'
    # Unset, and the expression falls back, so a repository with no runner
    # registered keeps the hosted behaviour rather than queueing forever.
    runs-on: ${{ fromJSON(vars.MACOS_RUNNER || '"macos-15"') }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Select pinned Rust toolchain
        run: |
          test "$(uname -m)" = arm64
          rustup show active-toolchain

      # Hosted runners start empty, so they install the four tools. Without
      # HOMEBREW_NO_AUTO_UPDATE, `brew install` first refreshes every tap: five
      # minutes of a fifteen-minute job in run 182, attempt 2. A self-hosted
      # runner brings its own, as it does nextest. Its service may run as a
      # user that does not own the Homebrew prefix, where `brew install` can
      # fail even with nothing to install. So that step never calls brew: it
      # checks the binaries the build uses, the linker at the path that
      # .cargo/config.toml pins included, and names any that are missing.
      - name: Install native build tools
        if: runner.environment == 'github-hosted'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install lld@22 uv zstd ninja
          # .cargo/config.toml links through /opt/homebrew/bin/ld64.lld and the vendored CPython
          # bitcode is LLVM 22 (crates/py/scripts/ld64.lld): the unversioned lld formula tracks
          # the newest major (23 today) and cannot link it.
          ln -sf "$(brew --prefix lld@22)/bin/ld64.lld" /opt/homebrew/bin/ld64.lld
      - name: Check provisioned native build tools
        if: runner.environment != 'github-hosted'
        run: |
          missing=()
          [ -x /opt/homebrew/bin/ld64.lld ] || missing+=(lld)
          for tool in uv zstd ninja; do
            command -v "$tool" >/dev/null || missing+=("$tool")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing on this runner: ${missing[*]}. As the owner of the Homebrew prefix, run: brew install ${missing[*]}"
            exit 1
          fi
      # Hosted runners start empty, so they install one pinned release. A
      # self-hosted runner brings its own: downloading the latest release on
      # every run took 11m38 in run 183 and then went unused, because an
      # existing install earlier in PATH shadowed it. There the step checks
      # the provisioned binary against the floor in .config/nextest.toml
      # instead; a missing or too-old nextest fails here with nextest's own
      # upgrade hint.
      - name: Install cargo-nextest
        if: runner.environment == 'github-hosted'
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2
        with:
          tool: nextest@0.9.146
      - name: Check provisioned cargo-nextest
        if: runner.environment != 'github-hosted'
        run: cargo nextest show-config version

      # Target dir outside the checkout on a self-hosted runner, embedded
      # CPython on both; shared with the P8 baseline workflow.
      - uses: ./.github/actions/macos-build-state
        with:
          min-free-gb: ${{ vars.CI_MIN_FREE_GB || '60' }}

      - name: Cache Cargo
        # A self-hosted runner keeps its target directory outside the checkout
        # (see above). Uploading it would mean tarring tens of GB against a
        # 10 GB repository cache limit on every job.
        if: runner.environment == 'github-hosted'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml', 'rust-toolchain.toml') }}-
            cargo-${{ runner.os }}-${{ runner.arch }}-

      # `--all-targets` (kept in sync with `just clippy`) so tests, examples
      # and benches are held to the same clippy.toml policy as library code.
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked

      - name: Test workspace
        run: cargo nextest run --profile ci --workspace --exclude omp-e2e --locked
      # nextest cannot run doctests; omp has them in 25+ modules, so they need
      # their own libtest pass or the coverage silently disappears.
      - name: Test doctests
        run: cargo test --doc --workspace --exclude omp-e2e --locked

      - name: Gate frozen Python examples
        run: python3 scripts/check-python-examples.py

      - name: Compile acceptance proofs
        run: cargo nextest run -p omp-e2e --tests --no-run --locked

      - name: Run harness unit tests and acceptance proofs P1-P6
        run: |
          cargo nextest run --profile ci -p omp-e2e --locked \
            --lib \
            --test p1_doc_race \
            --test p2_cancel_matrix \
            --test p3_detached_jobs \
            --test p4_schema_isolation \
            --test p5_prefix_stability \
            --test p6_crash_resume

      - name: Run terminal proof P7
        env:
          TERM: xterm-256color
        run: cargo nextest run --profile ci -p omp-e2e --test p7_tui --locked

      # Only the metric contract gates a pull request. The measurement itself
      # is recorded per omp2 commit by p8-baseline.yml, off the PR path.
      - name: Validate P8 baseline contract
        run: cargo nextest run --profile ci -p omp-e2e --test p8_baselines --locked

  # The workspace lint runs on macOS, so until this job existed no
  # `#[cfg(target_os = "linux")]` code had ever been linted by anything: the
  # Linux job next door runs one proof and no clippy. Every Linux-only path —
  # the ALSA/PulseAudio device backend, landlock, the envd host's fd handling —
  # was outside the gate that the rest of the tree is held to. Lint the same
  # workspace from the other side so a policy violation cannot hide behind a
  # target gate.
  lint_linux:
    name: Lint workspace (Linux)
    needs: format
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Select pinned Rust toolchain
        run: |
          test "$(uname -m)" = x86_64
          rustup show active-toolchain

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pipx zstd
          command -v uv >/dev/null || pipx install uv
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache embedded Python
        id: python-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: vendor/python
          key: python-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/py/scripts/fetch-python.sh', 'crates/py/scripts/pack-pymodules.py', 'crates/py/scripts/gen-py-notices.py', 'crates/py/requirements.txt') }}

      - name: Prepare embedded Python
        if: steps.python-cache.outputs.cache-hit != 'true'
        run: crates/py/scripts/fetch-python.sh

      - name: Verify embedded Python toolchain
        run: test -f vendor/python/pyo3-config.txt

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-lint-linux-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            cargo-lint-linux-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml', 'rust-toolchain.toml') }}-
            cargo-lint-linux-${{ runner.os }}-${{ runner.arch }}-

      # `--keep-going` so one crate's violation does not mask the rest: the
      # queue this job exists to drain is only visible if cargo reports every
      # failing crate in a single run rather than stopping at the first.
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked --keep-going

  # P9, P10, P11 and tool_sources were only ever run by `just e2e`. Nothing in them
  # needs macOS: they drive the production environment host, document
  # authority and embedded-Python extension host over unix sockets and
  # scratch roots, with no PTY and no Apple-only code path. They therefore
  # run here, on a hosted Linux runner, so the single self-hosted Mac (the
  # `rust` job's queue) does not get longer. Same provisioning as p7_linux,
  # and its Cargo cache is the fallback seed so a cold cache starts warm.
  p9_p10_linux:
    name: Acceptance proofs P9, P10 and tool sources (Linux)
    needs: format
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Select pinned Rust toolchain
        run: |
          test "$(uname -m)" = x86_64
          rustup show active-toolchain

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pipx zstd
          command -v uv >/dev/null || pipx install uv
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2
        with:
          tool: nextest@0.9.146

      - name: Cache embedded Python
        id: python-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: vendor/python
          key: python-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/py/scripts/fetch-python.sh', 'crates/py/scripts/pack-pymodules.py', 'crates/py/scripts/gen-py-notices.py', 'crates/py/requirements.txt') }}

      - name: Prepare embedded Python
        if: steps.python-cache.outputs.cache-hit != 'true'
        run: crates/py/scripts/fetch-python.sh

      - name: Verify embedded Python toolchain
        run: |
          test -f vendor/python/pyo3-config.txt
          test -x vendor/python/install/bin/python3.14td

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-e2e-linux-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            cargo-e2e-linux-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml', 'rust-toolchain.toml') }}-
            cargo-e2e-linux-${{ runner.os }}-${{ runner.arch }}-
            cargo-p7-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml', 'rust-toolchain.toml') }}-
            cargo-p7-${{ runner.os }}-${{ runner.arch }}-

      # `--profile ci` gives e2e tests the whole machine one at a time
      # (`threads-required = "num-cpus"` in .config/nextest.toml), so these
      # proofs never race for sockets or the shared embedded interpreter.
      - name: Run proofs P9, P10 and P11
        run: |
          cargo nextest run --profile ci -p omp-e2e --locked \
            --test p9_isolation \
            --test p9_extension_control \
            --test p10_lift_idempotence \
            --test p11_collab_spectator

      - name: Run tool source routing check
        run: cargo nextest run --profile ci -p omp-e2e --test tool_sources --locked

  p7_linux:
    name: Terminal proof P7 (Linux PTY)
    needs: format
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Select pinned Rust toolchain
        run: |
          test "$(uname -m)" = x86_64
          rustup show active-toolchain

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pipx zstd
          command -v uv >/dev/null || pipx install uv
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # This job runs the proof through `cargo nextest`, same as the macOS
      # workspace job, so it needs the same provisioning step.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2
        with:
          tool: nextest@0.9.146

      - name: Cache embedded Python
        id: python-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: vendor/python
          key: python-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/py/scripts/fetch-python.sh', 'crates/py/scripts/pack-pymodules.py', 'crates/py/scripts/gen-py-notices.py', 'crates/py/requirements.txt') }}

      - name: Prepare embedded Python
        if: steps.python-cache.outputs.cache-hit != 'true'
        run: crates/py/scripts/fetch-python.sh

      - name: Verify embedded Python toolchain
        run: |
          test -f vendor/python/pyo3-config.txt
          test -x vendor/python/install/bin/python3.14td

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-p7-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            cargo-p7-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml', 'rust-toolchain.toml') }}-
            cargo-p7-${{ runner.os }}-${{ runner.arch }}-

      - name: Run terminal proof P7 on Linux PTY
        env:
          TERM: xterm-256color
        run: cargo nextest run --profile ci -p omp-e2e --test p7_tui --locked
